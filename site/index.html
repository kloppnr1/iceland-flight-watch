<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Flight Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf1f2;--surface:#fff;--sunk:#e3e9eb;--ink:#142026;--muted:#58686f;--line:#d3dcdf;
  --lupine:#5a3ea3;--lupine-soft:#ece6f8;--moss:#2a7a4b;--moss-soft:#dff0e5;--ember:#b13a2c;--ember-soft:#f8e2de;
  --cheap1:#c9e6d3;--cheap2:#e4f2e9;--dear1:#f9e9e5;--dear2:#f1cfc8;
  --r-lg:16px;--r-md:10px;--r-sm:999px;
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1619;--surface:#172226;--sunk:#111b1e;--ink:#e4ecee;--muted:#8fa0a7;--line:#29373c;
  --lupine:#b9a3f2;--lupine-soft:#2a2342;--moss:#62c98d;--moss-soft:#173327;--ember:#ff8f80;--ember-soft:#3a1f1c;
  --cheap1:#1d4a32;--cheap2:#173328;--dear1:#2f2121;--dear2:#4a2724;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 15px/1.5 var(--font);background:var(--bg);color:var(--ink)}
a{color:var(--lupine)}
:focus-visible{outline:2px solid var(--lupine);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header + tabs */
header{max-width:1120px;margin:0 auto;padding:20px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
h1 .k{color:var(--lupine);display:inline-block;animation:fly-x 2.6s cubic-bezier(.4,0,.2,1) .4s both,fly-in .5s linear .4s both}
h1 .k i{font-style:normal;display:inline-block;position:relative;animation:fly-y 2.6s linear .4s both,fly-tilt 2.6s linear .4s both}
h1 .k i::before{content:"";position:absolute;right:100%;top:55%;width:34px;height:2px;margin-right:2px;border-radius:2px;background:linear-gradient(90deg,transparent,currentColor);animation:streak 2.6s linear .4s both}
@keyframes fly-in{from{opacity:0}to{opacity:1}}
@keyframes fly-x{from{translate:-170px 0}to{translate:0 0}}
@keyframes fly-y{0%,38%{translate:0 14px;animation-timing-function:cubic-bezier(.5,0,.3,1)}100%{translate:0 0}}
@keyframes fly-tilt{0%,36%{rotate:0deg;animation-timing-function:ease-in-out}66%{rotate:-15deg;animation-timing-function:ease-in-out}100%{rotate:0deg}}
@keyframes streak{0%{opacity:0;animation-timing-function:ease-out}30%{opacity:.55}70%{opacity:.55;animation-timing-function:ease-in}100%{opacity:0}}
.hl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dsel{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
.dsel select{width:auto;min-width:0;max-width:72vw;font-weight:600;min-height:40px;padding:6px 10px}
.dpanel{max-width:1120px;margin:0 auto 12px;padding:0 16px}
.dpanel .in{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.dpanel .fgrid{border-bottom:1px solid var(--line)}
.dpanel .act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px}
.dlist{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.dlist span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 4px 4px 12px;font-size:14px}
.dlist button{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer;min-width:32px;min-height:32px;border-radius:var(--r-sm)}
.dlist button:hover{color:var(--ember)}
.dstat{padding:6px 16px 10px;border-bottom:1px solid var(--line)}
.dstat details{border-top:1px solid var(--line);padding:10px 0}
.dstat details:first-child{border-top:0}
.dstat summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;min-height:40px}
.dstat summary::-webkit-details-marker{display:none}
.dstat .dn{font-weight:600}
.dstat .ds{flex:1;color:var(--muted);font-size:14px}
.dstat .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.dstat .dot.ok{background:var(--moss)}.dstat .dot.part{background:var(--lupine)}.dstat .dot.wait{background:#d4a017}
.dstat table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.dstat th{text-align:left;font-weight:500;color:var(--muted);padding:4px 8px 4px 0}
.dstat td:first-child{white-space:nowrap}
.dstat td{padding:5px 8px 5px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.dstat .rm{margin-left:auto;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;min-height:32px;padding:0 6px}
.dstat .rm:hover{color:var(--ember)}
.apsearch{grid-column:1/-1}
.aplist{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;max-width:640px}
.aplist:empty{display:none}
.aplist button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:var(--surface);color:inherit;font:inherit;font-size:15px;padding:10px 12px;cursor:pointer;min-height:44px}
.aplist li:first-child button{border-top:0}
.aplist button:hover,.aplist button:focus-visible{background:var(--lupine-soft)}
.aplist b{min-width:3.2em;color:var(--lupine)}
.aplist .sub{font-size:13px}
.apchosen{margin-top:6px;font-size:14px}
.srcnote{background:var(--lupine-soft);border-radius:var(--r-md);padding:10px 14px;font-size:14px;margin:0 0 14px;max-width:90ch}
.status{color:var(--muted);font-size:13px}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .in{max-width:1120px;margin:0 auto;padding:0 8px;display:flex;justify-content:space-between}
nav button[hidden]{display:none}
nav button{padding-left:10px;padding-right:10px}
nav button{border:0;background:none;font:600 14px/1.2 var(--font);color:var(--muted);padding:14px 4px 12px;cursor:pointer;border-bottom:3px solid transparent;min-height:48px}
nav button.on{color:var(--ink);border-bottom-color:var(--lupine)}
nav .s{display:none}
@media (max-width:640px){nav .l{display:none}nav .s{display:inline}nav .in{justify-content:flex-start;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0 6px;mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}nav .in::-webkit-scrollbar{display:none}nav button{flex:0 0 auto;font-size:14px;padding-left:11px;padding-right:11px;white-space:nowrap}}
main{max-width:1120px;margin:0 auto;padding:14px 16px 40px}

/* filters */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r-md);padding:3px;gap:2px}
.seg label{position:relative;padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-height:40px;display:flex;align-items:center}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,32,38,.12)}
.seg label{white-space:nowrap}
.seg label:has(input:focus-visible){outline:2px solid var(--lupine)}
.sw{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:14px;cursor:pointer;min-height:44px;padding:0 4px}
.sw input{appearance:none;-webkit-appearance:none;margin:0;width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked{background:var(--moss)}.sw input:checked::after{transform:translateX(16px)}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:16px}
details.more summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px}
details.more summary::-webkit-details-marker{display:none}
details.more summary b{font-weight:600}
details.more summary .sum{color:var(--muted);font-size:13px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
details.more summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .15s}
details.more[open] summary::after{transform:rotate(225deg);margin-top:4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 22px;padding:4px 16px 16px;border-top:1px solid var(--line);padding-top:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>.t{font-size:13px;color:var(--muted);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{position:relative;border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 13px;cursor:pointer;user-select:none;font-weight:500;font-size:14px;min-height:38px;display:flex;align-items:center}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chips label:has(input:checked){border-color:var(--lupine);background:var(--lupine-soft);color:var(--lupine);font-weight:600}
.chips label:has(input:focus-visible){outline:2px solid var(--lupine);outline-offset:2px}
.pair{display:flex;gap:6px;align-items:center}
.pair>input{flex:1;min-width:0}
select,input[type=number],input[type=date],input[type=text],input[type=password],input[type=search]{font:inherit;font-size:16px;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;min-height:42px;width:100%}
.f select{max-width:340px}

/* results */
.srt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:500}.srt select{width:auto;min-height:40px;padding:6px 10px;font-weight:600}
.why{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.lead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.list{display:grid;gap:10px}
@media (min-width:900px){.list.two{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 12px}
.card.best{border:2px solid var(--lupine);padding:16px 18px 14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.price{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.price small{font-size:15px;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
.best .price{font-size:40px;color:var(--lupine)}
.pr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.flag{font-size:12px;font-weight:700;white-space:nowrap;color:var(--lupine);margin-bottom:2px}
.head{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.legs{margin:12px 0 0;display:grid;gap:8px}
.leg{display:grid;grid-template-columns:52px 1fr auto;gap:2px 10px;align-items:baseline}
.leg .w{font-size:12px;font-weight:600;color:var(--muted)}
.leg .d{font-weight:600}
.leg .r{color:var(--muted);font-size:13px;grid-column:2}
.leg .p{grid-column:3;grid-row:1;text-align:right;font-weight:600}
.leg .x{grid-column:3;grid-row:2;text-align:right}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:var(--r-sm);background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.direct{background:var(--moss-soft);color:var(--moss)}
.tag.src{font-weight:500}
.chg{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:var(--r-sm);white-space:nowrap}
.chg.down{background:var(--moss-soft);color:var(--moss)}
.chg.up{background:var(--ember-soft);color:var(--ember);font-weight:600}
.chg.new{background:var(--lupine-soft);color:var(--lupine);font-weight:600}
.down{color:var(--moss)}.up{color:var(--ember)}
.links{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.links a{flex:1 1 0;min-width:0;white-space:nowrap;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-md);background:var(--sunk);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;padding:0 8px}
.links a:hover{background:var(--lupine-soft);color:var(--lupine)}
.links a.main{background:var(--lupine);color:#fff}
@media (prefers-color-scheme:dark){.links a.main{color:#160f2a}}
.links a.main:hover{filter:brightness(1.08)}
.card:not(.best) .links a.main{background:none;color:var(--lupine);box-shadow:inset 0 0 0 1.5px var(--lupine)}
.links a svg{width:13px;height:13px;flex:none;opacity:.75}
.morebtn{display:block;width:100%;margin:14px 0 0;min-height:48px;border:1px dashed var(--line);border-radius:var(--r-lg);background:none;color:var(--ink);font:600 15px var(--font);cursor:pointer}
.note{color:var(--muted);font-size:13px;max-width:70ch;margin:18px 0 0}
.empty{padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* calendar */
.legend{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 12px}
.legend i{display:inline-block;width:16px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px}
.month h3{margin:0 0 8px;font-size:15px;font-weight:700;display:flex;justify-content:space-between}
.month h3 span{font-weight:500;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.grid .dow{color:var(--muted);font-size:12px;padding-bottom:2px}
.grid .c{border-radius:8px;min-height:46px;padding:4px 0 3px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:var(--ink);position:relative}
.grid .c b{font-size:12px;font-weight:500;color:var(--muted)}
.grid .c span{font-size:12px;font-weight:600;letter-spacing:-.02em}
.grid .c.low{outline:2px solid var(--lupine);outline-offset:-2px}
.grid .c.low span{color:var(--lupine)}
.grid .c i{position:absolute;top:2px;right:3px;font-size:9px;font-style:normal}
.grid .c.none b{opacity:.5}
.grid .c em{font-style:normal;font-size:10px;font-weight:500;color:var(--muted);line-height:1}

/* patterns */
.pat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.pat h2{margin:0 0 4px;font-size:17px}
.pat .take{margin:0 0 14px;font-size:14px;color:var(--ink)}
.pat .take.dim{color:var(--muted)}
.plegend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 12px}
.plegend i{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.sdown{background:var(--moss)}.ssame{background:var(--line)}
.sup{background:var(--ember);background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(255,255,255,.45) 3px 5px)}
.brow{display:grid;grid-template-columns:96px 1fr auto;gap:4px 12px;align-items:center;padding:6px 0}
.brow .bl{font-size:14px;font-weight:600}
.brow .bv{font-size:13px;text-align:right;white-space:nowrap;font-weight:600}
.brow .bs{grid-column:2/-1;font-size:12px;color:var(--muted)}
.stack{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.stack span{display:block;height:100%}
.stack.nodata{background:repeating-linear-gradient(90deg,var(--sunk) 0 6px,transparent 6px 9px)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.wk .col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wk .bars{display:flex;gap:2px;align-items:flex-end;height:90px}
.wk .bars span{width:12px;border-radius:4px 4px 0 0;min-height:2px}
.wk .lab{font-size:12px;color:var(--muted)}
.wk .col.top .lab{color:var(--ink);font-weight:700}
.dayp{display:grid;gap:4px}
.drw{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;font-size:13px}
.drw .bar{height:12px;border-radius:0 4px 4px 0;background:var(--line)}
.drw.min .bar{background:var(--lupine)}
.drw .v{white-space:nowrap;text-align:right;min-width:118px}
.drw.min .v,.drw.min .d{font-weight:700;color:var(--lupine)}
.twocol{display:grid;gap:18px}
@media (min-width:900px){.twocol{grid-template-columns:1fr 1fr}.brow{grid-template-columns:110px 1fr 150px}.brow .bs{grid-column:2/3}}
.pat h3{font-size:14px;margin:0 0 8px}
/* delays */
.air{display:grid;gap:8px;margin-bottom:22px}
.arow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.arow .n{font-weight:700}
.meter{grid-column:1/-1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex}
.meter .mc{background:var(--ember)}.meter .md{background:color-mix(in srgb,var(--ember) 40%,transparent)}
h2{font-size:17px;margin:22px 0 10px;font-weight:700}
.fl{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:baseline}
.fl .st{grid-column:3;text-align:right;font-weight:600}

.leg .fi{grid-column:2/-1;font-size:13px;color:var(--muted)}
.tm{font-weight:600;color:var(--ink)}.nd{font-size:10px;color:var(--ember);margin-left:1px;font-weight:700}
.ft{margin-top:3px}
.tag.bag{background:var(--lupine-soft);color:var(--lupine)}
.bagnote{font-size:12px;color:var(--muted);margin:-4px 0 12px;max-width:80ch}
/* watches */
.wform{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:16px}
.wform .fgrid{border-top:1px solid var(--line)}
.wform summary::-webkit-details-marker{display:none}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{flex:1;white-space:nowrap;font:600 13px var(--font);color:var(--ink);background:var(--sunk);border:0;border-radius:var(--r-sm);padding:6px 6px;min-height:36px;cursor:pointer}
.presets button:hover{background:var(--lupine-soft);color:var(--lupine)}
.wform .act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 16px 16px}
.btn{font:600 15px var(--font);border:0;border-radius:var(--r-md);min-height:46px;padding:0 20px;cursor:pointer;background:var(--lupine);color:#fff}
@media (prefers-color-scheme:dark){.btn{color:#160f2a}}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:none;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;min-height:40px;padding:0 14px}
.btn.ghost:hover{color:var(--ember);box-shadow:inset 0 0 0 1px var(--ember)}
.msg{font-size:14px;font-weight:600}.msg.err{color:var(--ember)}.msg.ok{color:var(--moss)}
.card.good{border:2px solid var(--moss)}
.goodbar{background:var(--moss);color:#fff;font-weight:700;font-size:14px;border-radius:var(--r-md);padding:8px 12px;margin:-2px 0 12px;display:flex;justify-content:space-between;gap:10px}
@media (prefers-color-scheme:dark){.goodbar{color:#0c2116}}
.target{font-size:13px;color:var(--muted);white-space:nowrap}
.spark{margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.spark svg{width:100%;height:56px;display:block;overflow:visible}
.spark .meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.4}
.wfoot{display:flex;justify-content:flex-end;margin-top:10px}
@media (max-width:640px){
  header{padding:16px 14px 8px}main{padding:12px 12px 36px}
  .bar{gap:6px}.seg{flex:1}.seg label{flex:1;justify-content:center;padding:9px 6px}
  .card{padding:13px 14px 12px}.card.best{padding:15px 15px 13px}
  .best .price{font-size:34px}
  .lead span+span{display:none}
  .wsub{display:none}
  .fgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}h1 .k,h1 .k i,h1 .k i::before{animation:none}}

<body>
<header><div class="hl"><h1>Flight Watch <span class="k"><i>✈</i></span></h1><label class="dsel">to <select id="dest" aria-label="Destination airport"><option>Keflavík</option></select></label></div><div class="status" id="status">Loading prices…</div></header>
<div class="dpanel" id="dpanel" hidden></div>
<nav aria-label="Views"><div class="in">
  <button data-v="trips" class="on"><span class="l">Cheapest flights</span><span class="s">Flights</span></button>
  <button data-v="watch"><span class="l">Watches</span><span class="s">Watches</span></button>
  <button data-v="cal"><span class="l">Price calendar</span><span class="s">Calendar</span></button>
  <button data-v="changes"><span class="l">Changes</span><span class="s">Changes</span></button>
  <button data-v="pat"><span class="l">Patterns</span><span class="s">Patterns</span></button>
  <button data-v="any"><span class="l">Anywhere</span><span class="s">Anywhere</span></button>
  <button data-v="rel" id="relTab"><span class="l">Cancellations &amp; delays</span><span class="s">Delays</span></button>
</div></nav>
<main>
<div id="filters"></div>
<div id="view"></div>
</main>
<script>
const APTS=['CPH','BLL','AAR','AAL','HAM'],NAME={CPH:'Copenhagen',BLL:'Billund',AAR:'Aarhus',AAL:'Aalborg',HAM:'Hamburg'};
const ANY_FROM=[...APTS,'KEF'];let ANY=null,ANYAP={};
let DESTS=[{code:'KEF',name:'Keflavík',place:'Iceland'}];
const destOf=c=>DESTS.find(d=>d.code===c);
const nm=c=>NAME[c]||destOf(c)?.name||c;
const DST=()=>st.dest;const PLACE=()=>destOf(st.dest)?.place||st.dest;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kr=v=>v==null?'–':Math.round(v).toLocaleString('da-DK');
const KR=v=>v==null?'–':kr(v)+' kr';
const D=s=>new Date(s+'T12:00:00Z');const iso=d=>d.toISOString().slice(0,10);
const add=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const days=(a,b)=>Math.round((D(b)-D(a))/864e5);
const fd=s=>D(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'2-digit'});
const gf=(o,d,date,direct)=>'https://www.google.com/travel/flights?hl=en&curr=DKK&q='+encodeURIComponent(`${direct?'nonstop ':''}one way flights from ${o} to ${d} on ${date}`);
const gfRT=(o,d1,d2,direct)=>'https://www.google.com/travel/flights?hl=en&curr=DKK&q='+encodeURIComponent(`${direct?'nonstop ':''}flights from ${o} to ${DST()} on ${d1} returning ${d2}`);
const EXT='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2h6v6M10 2 3 9" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
const lnk=(href,label,cls='')=>`<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener">${label}${EXT}</a>`;
let L=null,CH=[],BOARD=[],WATCH=[],BAGS=null,PAT=null,view='trips';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const st={dest:lsGet('ifw_dest','KEF'),bag:lsGet('ifw_bag','0')==='1',type:'rt',out:new Set(APTS),home:new Set(APTS),owDir:'to',owApt:new Set(APTS),anyFrom:new Set(ANY_FROM),anyType:lsGet('ifw_any_type','ow'),mix:lsGet('ifw_rt_mix','1')==='1',anyMix:lsGet('ifw_any_mix','0')==='1',anyMin:lsGet('ifw_any_min','3'),anyMax:lsGet('ifw_any_max','7'),anySort:lsGet('ifw_any_sort','price'),anyDest:(()=>{try{const v=JSON.parse(lsGet('ifw_any_dest','[]'));return Array.isArray(v)?v.map(String):[]}catch(e){return []}})(),anyMaxp:'',minM:1,maxM:6,unit:lsGet('ifw_stay_unit','m'),minD:30,maxD:182,stops:'direct',from:'',to:'',maxp:'',
  route:'ALL-'+lsGet('ifw_dest','KEF'),kind:'direct',chDir:'both',chWhat:'drops',limit:40,open:matchMedia('(min-width:900px)').matches};

function series(route,kind,prev){const src=prev?L.prev_cal:L.cal;const c=src?.[route]?.[kind];const m=new Map();if(!c)return m;let d=c.start;c.p.forEach(v=>{if(v)m.set(d,v);d=add(d,1)});return m;}
const hasPrev=()=>!!L.prev_cal;
function chg(now,prev){if(!hasPrev())return '';if(prev==null)return '<span class="chg new">New</span>';
  if(now<prev)return `<span class="chg down" title="Was ${KR(prev)} at the last check">▼ ${KR(prev-now)}</span>`;
  if(now>prev)return `<span class="chg up" title="Was ${KR(prev)} at the last check">▲ ${KR(now-prev)}</span>`;return '';}

// ---------- filters UI ----------
function chips(id,label,vals,set,names){return `<div class="f"><span class="t">${label}</span><div class="chips" data-set="${id}">${vals.map(v=>`<label><input type="checkbox" value="${v}" ${set.has(v)?'checked':''}><span>${names?names[v]:v}</span></label>`).join('')}</div></div>`}
function seg(id,opts,cur,aria){return `<div class="seg" role="radiogroup" aria-label="${aria}" data-radio="${id}">${opts.map(([v,l])=>`<label><input type="radio" name="${id}" value="${v}" ${cur===v?'checked':''}>${l}</label>`).join('')}</div>`}
function radios(id,label,opts,cur){return `<div class="f"><span class="t">${label}</span>${seg(id,opts,cur,label)}</div>`}
const directSw=()=>`<label class="sw"><input type="checkbox" id="directSw" ${st.stops==='direct'?'checked':''}>Direct only</label>`;
const aptSum=s=>s.size===APTS.length?'All airports':s.size?[...s].join(', '):'No airports';
// stay as [shortest, longest] in days, from the months or days fields
const stayDays=()=>st.unit==='d'?[Math.max(0,Math.round(+st.minD)||0),Math.round(+st.maxD)||9999]:[Math.round(+st.minM*30.4),Math.round(+st.maxM*30.4)||9999];
const stayTxt=()=>st.unit==='d'?`${st.minD}–${st.maxD} days`:`${st.minM}–${st.maxM} months`;
function filterSummary(){
  const dt=st.from||st.to?`${st.from?fd(st.from):'now'} to ${st.to?fd(st.to):'any'}`:'Any date';
  const mp=st.maxp?`max ${KR(+st.maxp)}`:'';
  if(view==='trips'&&st.type==='rt')return [!st.mix?aptSum(st.out)+', same airport home':aptSum(st.out)===aptSum(st.home)?aptSum(st.out):`${aptSum(st.out)} out, ${aptSum(st.home)} home`,stayTxt(),dt,mp].filter(Boolean).join(', ');
  if(view==='trips')return [st.owDir==='to'?'To '+PLACE():'From '+PLACE(),aptSum(st.owApt),dt,mp].filter(Boolean).join(', ');
  return [st.chDir==='both'?'Both ways':st.chDir==='to'?'To '+PLACE():'From '+PLACE(),aptSum(st.out)].join(', ');
}
function more(inner){return `<details class="more" id="more" ${st.open?'open':''}><summary><b>Filters</b><span class="sum" id="fsum">${esc(filterSummary())}</span></summary><div class="fgrid">${inner}</div></details>`}
function drawFilters(){
  let h='';
  if(view==='trips'){
    h+=`<div class="bar">${seg('type',[['rt','Round trip'],['ow','One way']],st.type,'Trip type')}${directSw()}${bagSw()}</div>${bagNote()}`;
    if(st.type==='rt'){
      h+=more(chips('out','Fly out from',APTS,st.out)+`<div class="f"><span class="t">Fly home to</span>${seg('mix',[['0','Same airport'],['1','Pick airports']],st.mix?'1':'0','Fly home to')}${st.mix?`<div class="chips" data-set="home" style="margin-top:8px">${APTS.map(v=>`<label><input type="checkbox" value="${v}" ${st.home.has(v)?'checked':''}><span>${v}</span></label>`).join('')}</div>`:''}</div>`+
        `<div class="f"><span class="t">Stay</span>${seg('unit',[['m','Months'],['d','Days']],st.unit,'Stay in months or days')}${st.unit==='d'
          ?`<div class="pair" style="margin-top:8px"><input type="number" inputmode="numeric" min="1" max="365" step="1" id="minD" value="${st.minD}" aria-label="Shortest stay in days"><span>to</span><input type="number" inputmode="numeric" min="1" max="365" step="1" id="maxD" value="${st.maxD}" aria-label="Longest stay in days"></div>`
          :`<div class="pair" style="margin-top:8px"><input type="number" inputmode="decimal" min="0" max="11" step="0.5" id="minM" value="${st.minM}" aria-label="Shortest stay in months"><span>to</span><input type="number" inputmode="decimal" min="0" max="11" step="0.5" id="maxM" value="${st.maxM}" aria-label="Longest stay in months"></div>`}</div>`+
        `<div class="f"><span class="t">Leave between</span><div class="pair"><input type="date" id="from" value="${st.from}" aria-label="Earliest departure"><input type="date" id="to" value="${st.to}" aria-label="Latest departure"></div></div>`+
        `<div class="f"><span class="t">Max total price (kr)</span><input type="number" inputmode="numeric" id="maxp" value="${st.maxp}" placeholder="Any price"></div>`);
    }else{
      h+=more(radios('owDir','Direction',[['to','To '+esc(PLACE())],['from','From '+esc(PLACE())]],st.owDir)+
        chips('owApt',st.owDir==='to'?'Fly from':'Fly to',APTS,st.owApt)+
        `<div class="f"><span class="t">Travel between</span><div class="pair"><input type="date" id="from" value="${st.from}" aria-label="Earliest travel date"><input type="date" id="to" value="${st.to}" aria-label="Latest travel date"></div></div>`+
        `<div class="f"><span class="t">Max price (kr)</span><input type="number" inputmode="numeric" id="maxp" value="${st.maxp}" placeholder="Any price"></div>`);
    }
  } else if(view==='watch'){
    h+=`<div class="bar">${bagSw()}</div>${bagNote()}`+watchForm();
  } else if(view==='cal'){
    const D_=DST(),routes=Object.keys(L.cal).filter(r=>r.split('-').includes(D_)).sort((a,b)=>(a.startsWith(D_)-b.startsWith(D_))||a.localeCompare(b));
    const kinds=st.route.includes('ALL')?['any','direct']:Object.keys(L.cal[st.route]||{});if(!kinds.includes(st.kind))st.kind='any';
    const opt=(v,l)=>`<option value="${v}" ${v===st.route?'selected':''}>${l}</option>`;
    h+=`<div class="bar"><select id="route" aria-label="Route" style="flex:1;max-width:360px">${opt('ALL-'+D_,'All airports → '+esc(nm(D_)))}${opt(D_+'-ALL',esc(nm(D_))+' → all airports')}${routes.map(r=>opt(r,`${esc(nm(r.split('-')[0]))} → ${esc(nm(r.split('-')[1]))}`)).join('')}</select>`+
      (kinds.includes('direct')?`<label class="sw"><input type="checkbox" id="calDirect" ${st.kind==='direct'?'checked':''}>Direct only</label>`:`<span class="sub">No direct flights on this route</span>`)+`</div>`;
  } else if(view==='pat'){
    h+=`<div class="bar">${directSw()}</div>`;
  } else if(view==='any'){
    h+=`<div class="bar">${seg('anyType',[['ow','One way'],['rt','Round trip']],st.anyType,'Trip type')}${st.anyType==='rt'?`<div class="pair" style="max-width:260px"><input type="number" inputmode="numeric" min="1" max="120" step="1" id="anyMin" value="${st.anyMin}" aria-label="Fewest days away"><span>to</span><input type="number" inputmode="numeric" min="1" max="120" step="1" id="anyMax" value="${st.anyMax}" aria-label="Most days away"><span>days</span></div><label class="sw"><input type="checkbox" id="anyMix" ${st.anyMix?'checked':''}>Home to another airport is fine</label>`:''}</div>`;
    h+=`<div class="bar"><label class="srt">Sort by <select id="anySort">${[['price','Lowest price'],['save','Best deal'],['soon','Leaving soonest'],['az','Country A–Z']].map(([v,l])=>`<option value="${v}" ${v===st.anySort?'selected':''}>${l}</option>`).join('')}</select></label><input type="number" inputmode="numeric" id="anyMaxp" value="${st.anyMaxp}" placeholder="Max price (kr)" aria-label="Max price in kr" style="max-width:170px"></div>`;
    h+=chips('anyFrom',st.anyType!=='rt'?'Fly from':st.anyMix?'Fly from, and home to any of these':'Fly from (and home to the same airport)',ANY_FROM,st.anyFrom);
    h+=anyDestPick();
  } else if(view==='changes'){
    h+=`<div class="bar">${seg('chWhat',[['drops','Drops'],['rises','Rises'],['all','All']],st.chWhat,'Show')}</div>`;
    h+=more(radios('chDir','Direction',[['both','Both'],['to','To '+esc(PLACE())],['from','From '+esc(PLACE())]],st.chDir)+chips('out','Danish or German airport',APTS,st.out));
  } else {
    h+=`<div class="bar">${seg('chDir',[['both','Both ways'],['to','To '+esc(PLACE())],['from','From '+esc(PLACE())]],st.chDir,'Direction')}</div>`;
    h+=more(chips('out','Danish or German airport',APTS,st.out));
  }
  const F=$('filters');F.innerHTML=h;
  const upd=()=>{const s=$('fsum');if(s)s.textContent=filterSummary();st.limit=40;render()};
  F.querySelectorAll('[data-set] input').forEach(i=>i.onchange=()=>{const s=st[i.closest('[data-set]').dataset.set];i.checked?s.add(i.value):s.delete(i.value);upd()});
  F.querySelectorAll('[data-radio] input').forEach(i=>i.onchange=()=>{
    if(i.name==='unit'){  // keep the same stay when switching between months and days
      if(i.value==='d'){st.minD=Math.round(+st.minM*30.4)||1;st.maxD=Math.round(+st.maxM*30.4)||365;}
      else{st.minM=Math.round(+st.minD/30.4*2)/2;st.maxM=Math.max(.5,Math.round(+st.maxD/30.4*2)/2);}
      st.unit=i.value;lsSet('ifw_stay_unit',st.unit);drawFilters();render();return;}
    if(i.name==='mix'){st.mix=i.value==='1';lsSet('ifw_rt_mix',i.value);st.limit=40;drawFilters();render();return;}
    st[i.name]=i.value;if(i.name==='anyType')lsSet('ifw_any_type',i.value);if(i.name==='type'||i.name==='owDir'||i.name==='anyType'){st.limit=40;drawFilters();render()}else upd()});
  ['minM','maxM','minD','maxD','from','to','maxp'].forEach(id=>{const e=$(id);if(e)e.oninput=()=>{st[id]=e.value;upd()}});
  ['anyMin','anyMax'].forEach(id=>{const e=$(id);if(e)e.oninput=()=>{st[id]=e.value;lsSet('ifw_'+id.replace('any','any_').toLowerCase(),e.value);upd()}});
  const ds=$('directSw');if(ds)ds.onchange=()=>{st.stops=ds.checked?'direct':'any';upd()};
  const bs=$('bagSw');if(bs)bs.onchange=()=>{st.bag=bs.checked;lsSet('ifw_bag',st.bag?'1':'0');drawFilters();render()};
  const as=$('anySort');if(as)as.onchange=()=>{st.anySort=as.value;lsSet('ifw_any_sort',as.value);st.limit=40;render()};
  const ax=$('anyMaxp');if(ax)ax.oninput=()=>{st.anyMaxp=ax.value;st.limit=40;render()};
  const am=$('anyMix');if(am)am.onchange=()=>{st.anyMix=am.checked;lsSet('ifw_any_mix',st.anyMix?'1':'0');drawFilters();render()};
  const setDest=v=>{st.anyDest=v;lsSet('ifw_any_dest',JSON.stringify(v));st.limit=40;drawFilters();render()};
  const da=$('anyDestAdd');if(da)da.onchange=()=>{if(da.value)setDest([...st.anyDest,da.value])};
  F.querySelectorAll('#anyDestSel input').forEach(i=>i.onchange=()=>setDest(st.anyDest.filter(k=>k!==i.value)));
  const cd=$('calDirect');if(cd)cd.onchange=()=>{st.kind=cd.checked?'direct':'any';render()};
  const rs=$('route');if(rs)rs.onchange=()=>{st.route=rs.value;drawFilters();render()};
  const m=$('more');if(m)m.ontoggle=()=>{st.open=m.open};
  if(view==='watch')wireWatchForm();
}
const moreBtn=(shown,total)=>shown<total?`<button class="morebtn" id="morebtn">Show more (${total-shown} left)</button>`:'';
function wireMore(){const b=$('morebtn');if(b)b.onclick=()=>{st.limit+=40;render()};}
const empty=(t,s)=>`<div class="empty"><b>${t}</b>${s}</div>`;

// ---------- flight details + bags ----------
const det=(o,d,date,direct)=>L.det?.[`${o}-${d}`]?.[date]?.[direct?'direct':'any']||null;
const dur=m=>m==null?'':(Math.floor(m/60)?`${Math.floor(m/60)} h`:'')+(m%60?`${Math.floor(m/60)?' ':''}${m%60} min`:'');
const stopsTxt=n=>n==null?'':n?`${n} stop${n>1?'s':''}`:'Direct';
const times=(x,date)=>x&&x.dep?`${esc(x.dep)}–${esc(x.arr)}${x.arr_day&&x.arr_day>date?`<sup class="nd">+${days(date,x.arr_day)}</sup>`:''}`:'';
const timesTxt=(x,date)=>x&&x.dep?`${x.dep}–${x.arr}${x.arr_day&&x.arr_day>date?' +'+days(date,x.arr_day):''}`:'';
const detTxt=(x,date)=>x?[timesTxt(x,date),dur(x.min),stopsTxt(x.stops),x.al].filter(Boolean).join(', '):'';
const bagFee=x=>{if(!st.bag)return 0;const def=BAGS?.default??350;const al=x?.al?String(x.al).split(',')[0].trim():'';const v=al?BAGS?.airlines?.[al]:undefined;return v==null?def:v;};
const bagTag=fee=>fee?`<span class="tag bag">+${KR(fee)} bag</span>`:'';
function legHTML(label,o,d,date,fare,x,extra){
  const fee=bagFee(x);
  return `<div class="leg"><span class="w">${label}</span><span class="d">${fd(date)}</span><span class="p">${KR(fare+fee)}</span>
  <span class="r">${o} → ${d}${x&&x.dep?`, <b class="tm">${times(x,date)}</b>`:''}</span><span class="x">${bagTag(fee)||extra||''}</span>
  ${x?`<span class="fi">${[dur(x.min),stopsTxt(x.stops),esc(x.al)].filter(Boolean).join(', ')}</span>`:''}</div>`;
}
const bagSw=()=>`<label class="sw"><input type="checkbox" id="bagSw" ${st.bag?'checked':''}>With checked bag</label>`;
const bagNote=()=>st.bag?`<p class="bagnote">Prices include one checked bag per flight. ${esc(BAGS?.note||'')}</p>`:'';
const inclBag=()=>st.bag?'<span class="target">incl. bag (est.)</span>':'';

// ---------- round trips ----------
function trips(){
  const direct=st.stops==='direct',kind=direct?'direct':'any',[minD,maxD]=stayDays(),today=iso(new Date());
  const rows=[];
  const K=DST();
  for(const o of st.out){const A=series(`${o}-${K}`,kind);if(!A.size)continue;const Ad=direct?A:series(`${o}-${K}`,'direct'),Ap=series(`${o}-${K}`,kind,true);
    for(const h of st.mix?st.home:[o]){const B=series(`${K}-${h}`,kind);if(!B.size)continue;const Bd=direct?B:series(`${K}-${h}`,'direct'),Bp=series(`${K}-${h}`,kind,true);
      const bArr=[...B.entries()].sort().map(([d,p])=>{const x=det(K,h,d,direct);return [d,p,x,p+bagFee(x)]});
      for(const [d1,p1] of A){if(d1<today||(st.from&&d1<st.from)||(st.to&&d1>st.to))continue;
        let best=null;for(const e of bArr){const n=days(d1,e[0]);if(n<minD)continue;if(n>maxD)break;if(!best||e[3]<best[3])best=e;}
        if(!best)continue;const [d2,p2,x2,a2]=best,x1=det(o,K,d1,direct),a1=p1+bagFee(x1);
        rows.push({o,h,d1,d2,p1,p2,x1,x2,fare:p1+p2,total:a1+a2,stay:days(d1,d2),dir1:Ad.get(d1),dir2:Bd.get(d2),prev:(Ap.get(d1)&&Bp.get(d2))?Ap.get(d1)+Bp.get(d2):null});}
    }}
  const mx=+st.maxp||Infinity;return rows.filter(r=>r.total<=mx).sort((a,b)=>a.total-b.total);
}
const dirTag=(d,p)=>st.stops==='direct'?'':d?(d===p?'':`<span class="tag direct">Direct ${KR(d)}</span>`):'';
function rtCard(r,best){
  const direct=st.stops==='direct',flag=best?'<div class="flag">Cheapest right now</div>':'';
  const ft=r.x1?.min!=null&&r.x2?.min!=null?`<div class="sub ft">${dur(r.x1.min+r.x2.min)} flying in total</div>`:'';
  return `<article class="card${best?' best':''}"><div class="top"><div><div class="head">${r.stay} days in ${esc(PLACE())}</div><div class="sub">${nm(r.o)} out, ${nm(r.h)} home</div>${ft}</div><div class="pr">${flag}<div class="price">${kr(r.total)}<small>kr</small></div>${inclBag()}${chg(r.fare,r.prev)}</div></div>
  <div class="legs">${legHTML('Out',r.o,DST(),r.d1,r.p1,r.x1,dirTag(r.dir1,r.p1))}${legHTML('Home',DST(),r.h,r.d2,r.p2,r.x2,dirTag(r.dir2,r.p2))}</div>
  <div class="links">${lnk(gf(r.o,DST(),r.d1,direct),'Out flight')}${lnk(gf(DST(),r.h,r.d2,direct),'Home flight')}${r.o===r.h?lnk(gfRT(r.o,r.d1,r.d2,direct),'Round trip','main'):''}</div></article>`;
}
function renderTrips(){
  if(st.type==='ow')return renderOneWay();
  const all=trips();
  if(!all.length){$('view').innerHTML=noData()||empty('No round trips match these filters.',st.stops==='direct'?'Try turning off Direct only, or widen the stay or dates.':'Try more airports, a longer stay or a wider date range.');return;}
  // keep the cheapest trip per departure week + airport pair so the list is varied
  const seen=new Set(),rows=[];for(const r of all){const k=r.o+r.h+r.d1.slice(0,8)+Math.floor(+r.d1.slice(8)/8);if(seen.has(k))continue;seen.add(k);rows.push(r);if(rows.length>=150)break;}
  const shown=rows.slice(0,st.limit);

  <p class="note">Each trip adds the cheapest one-way fare out to the cheapest one-way fare home, found on ${srcName()}. Open the links to see the exact flights.</p>`;
  wireMore();
}

// ---------- one way ----------
function oneway(){
  const direct=st.stops==='direct',kind=direct?'direct':'any',today=iso(new Date()),rows=[];
  for(const a of st.owApt){const o=st.owDir==='to'?a:DST(),d=st.owDir==='to'?DST():a,route=`${o}-${d}`;
    const S=series(route,kind);if(!S.size)continue;const P=series(route,kind,true),Dd=direct?S:series(route,'direct');
    for(const [date,p] of S){if(date<today||(st.from&&date<st.from)||(st.to&&date>st.to))continue;const x=det(o,d,date,direct);rows.push({o,d,date,p,x,total:p+bagFee(x),prev:P.get(date),dirp:Dd.get(date)});}}

}

function renderOneWay(){

// ---------- price calendar ----------
// One route, or "All": the cheapest airport each day (to or from the destination)
function calSeries(prev){
  const [o,d]=st.route.split('-');
  if(o!=='ALL'&&d!=='ALL'){const m=series(st.route,st.kind,prev),r=new Map();m.forEach((v,k)=>r.set(k,{v,o,d}));return r;}
  const r=new Map();
  for(const a of APTS){const oo=o==='ALL'?a:DST(),dd=d==='ALL'?a:DST();
    series(`${oo}-${dd}`,st.kind,prev).forEach((v,k)=>{const c=r.get(k);if(!c||v<c.v)r.set(k,{v,o:oo,d:dd})});}
  return r;
}
function renderCal(){
  const [o,d]=st.route.split('-'),all=o==='ALL'||d==='ALL',direct=st.kind==='direct';
  const cur=calSeries(false),prev=calSeries(true);

  const vals=[...cur.values()].map(x=>x.v).sort((a,b)=>a-b),q=p=>vals[Math.floor(p*(vals.length-1))],c1=q(.2),c2=q(.5),c3=q(.8),low=vals[0];
  const col=v=>v<=c1?'var(--cheap1)':v<=c2?'var(--cheap2)':v<=c3?'var(--dear1)':'var(--dear2)';
  const keys=[...cur.keys()].sort();const months=[];let m=keys[0].slice(0,7);while(m<=keys[keys.length-1].slice(0,7)){months.push(m);const dd=D(m+'-01');dd.setUTCMonth(dd.getUTCMonth()+1);m=iso(dd).slice(0,7);}
  const k0=keys[0],skip=k0.slice(0,7)===months[0]?Math.max(0,+k0.slice(8)-1-(D(k0).getUTCDay()+6)%7):0;
  const html=months.map((mm,mi)=>{const first=D(mm+'-01'),s0=mi?0:skip,off=s0?0:(first.getUTCDay()+6)%7;let cells=['M','T','W','T','F','S','S'].map(x=>`<div class="dow" aria-hidden="true">${x}</div>`).join('')+'<div></div>'.repeat(off);let mlow=null;
    for(let day=s0+1;day<=31;day++){const ds=`${mm}-${String(day).padStart(2,'0')}`;if(D(ds).getUTCMonth()!==first.getUTCMonth())break;const c=cur.get(ds),v=c?.v,pv=prev.get(ds)?.v;
      if(v&&(mlow==null||v<mlow))mlow=v;
      const arrow=v&&pv&&v!==pv?(v<pv?'<i class="down">▼</i>':'<i class="up">▲</i>'):'';
      const x=c?det(c.o,c.d,ds,direct):null,info=x?', '+detTxt(x,ds):'',apt=c?(c.o===DST()?c.d:c.o):'';
      cells+=v?`<a class="c${v===low?' low':''}" style="background:${col(v)}" href="${gf(c.o,c.d,ds,direct)}" target="_blank" rel="noopener" title="${fd(ds)}: ${KR(v)}, ${c.o} → ${c.d}${esc(info)}${pv&&pv!==v?' (was '+KR(pv)+')':''}" aria-label="${fd(ds)}, ${KR(v)}, ${c.o} to ${c.d}"><b>${day}</b><span>${kr(v)}</span>${all?`<em>${apt}</em>`:''}${arrow}</a>`:`<div class="c none"><b>${day}</b></div>`;}
    return `<section class="month"><h3>${D(mm+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'})}${mlow?`<span>from ${KR(mlow)}</span>`:''}</h3><div class="grid">${cells}</div></section>`}).join('');
  const what=o==='ALL'?'from any airport to '+esc(nm(DST())):d==='ALL'?'from '+esc(nm(DST()))+' to any airport':`${esc(nm(o))} → ${esc(nm(d))}`;
  $('view').innerHTML=srcNote()+`<div class="lead"><span>Cheapest ${direct?'direct ':''}one-way price each day, ${what}${all?' (the airport is shown under the price)':''}. Lowest: <b style="color:var(--lupine)">${KR(low)}</b></span></div>
  <div class="legend"><span><i style="background:var(--cheap1)"></i>Cheapest fifth</span><span><i style="background:var(--dear2)"></i>Priciest fifth</span><span><i style="outline:2px solid var(--lupine);outline-offset:-2px"></i>Lowest price</span><span><b class="down">▼</b> <b class="up">▲</b> Changed since last check</span><span>Tap a day to open Google Flights</span></div>

// ---------- anywhere ----------
// destination picker: chosen cities (airport code) and countries ('c:' + country); nothing chosen = everywhere
const anyDests=()=>{const s=new Set();for(const r of Object.keys(ANY?.routes||{})){const d=r.split('-')[1];if(!ANY_FROM.includes(d))s.add(d)}return [...s]};

  const ds=anyDests(),cs=[...new Set(ds.map(d=>ANYAP[d]?.[3]).filter(Boolean))].sort((a,b)=>a.localeCompare(b)),by=(a,b)=>anyDestName(a).localeCompare(anyDestName(b));
  const opt=k=>st.anyDest.includes(k)?'':`<option value="${esc(k)}">${esc(anyDestName(k))}</option>`;
  return `<div class="f" style="margin-top:12px"><span class="t">Fly to</span>${st.anyDest.length?`<div class="chips" id="anyDestSel" style="margin-bottom:8px">${st.anyDest.map(k=>`<label title="Remove"><input type="checkbox" value="${esc(k)}" checked><span>${esc(anyDestName(k))} ×</span></label>`).join('')}</div>`:''}
   <select id="anyDestAdd" aria-label="Add a destination" style="max-width:320px"><option value="">${st.anyDest.length?'Add another…':'Anywhere – pick a country or city…'}</option>${ds.length?`<optgroup label="Countries">${cs.map(c=>opt('c:'+c)).join('')}</optgroup><optgroup label="Cities">${ds.sort(by).map(opt).join('')}</optgroup>`:''}</select></div>`;
}
const anyDestOk=(d,b)=>!st.anyDest.length||st.anyDest.includes(d)||st.anyDest.includes('c:'+b.country);
async function renderAny(){
  if(!ANY){$('view').innerHTML='<p class="sub">Loading…</p>';
    let al;[ANY,al]=await Promise.all([fetch('data/anywhere.json',{cache:'no-store'}).then(r=>r.ok?r.json():{routes:{}}).catch(()=>({routes:{}})),loadAirports()]);
    (al||[]).forEach(a=>ANYAP[a[0]]=a);
    if(view==='any')drawFilters();  // the destination picker needs the list
    if(view!=='any')return;}
  const ap=ANYAP,t=iso(new Date()),best={},rt=st.anyType==='rt';
  const C=ANY.cal||{},T=days('2000-01-01',t);
  const skip=(o,d)=>!st.anyFrom.has(o)||ANY_FROM.includes(d)&&st.anyFrom.has(d);  // e.g. CPH→KEF when KEF is a home airport too
  if(!rt){
    for(const [r,[date,p]] of Object.entries(ANY.routes||{})){const [o,d]=r.split('-');
      if(skip(o,d)||date<t)continue;
      if(!best[d]||p<best[d].p)best[d]={o,date,p};}
  }else{
    // round trip = cheapest one-way out + cheapest one-way home, n days later; home to the same airport, or with
    // "another airport is fine" to any chosen one on the same side (Denmark/Hamburg, or Iceland)
    let lo=Math.max(1,Math.round(+st.anyMin)||1),hi=Math.max(lo,Math.round(+st.anyMax)||lo);hi=Math.min(hi,lo+120);
    for(const r of Object.keys(C)){const [o,d]=r.split('-');if(skip(o,d))continue;
      const A=C[r],a0=days('2000-01-01',A.start);
      for(const h of st.anyMix?ANY_FROM.filter(x=>st.anyFrom.has(x)&&(x==='KEF')===(o==='KEF')):[o]){const B=C[d+'-'+h];if(!B)continue;
        const b0=days('2000-01-01',B.start);
        for(let i=0;i<A.p.length;i++){const p1=A.p[i];if(!p1||a0+i<T)continue;
          if(best[d]&&p1>=best[d].p)continue;
          for(let n=lo;n<=hi;n++){const j=a0+i+n-b0;if(j<0)continue;if(j>=B.p.length)break;const p2=B.p[j];if(!p2)continue;
            if(!best[d]||p1+p2<best[d].p)best[d]={o,h,date:add(A.start,i),back:add(A.start,i+n),n,p1,p2,p:p1+p2};}}}}
  }
  // what matters besides the price: how it compares with the route's usual price, how many days have it, how soon it leaves
  const fut=A=>A?A.p.slice(Math.max(0,T-days('2000-01-01',A.start))).filter(Boolean):[];
  const med=A=>{const v=fut(A).sort((a,b)=>a-b);return v.length>=14?v[v.length>>1]:null};
  for(const [d,b] of Object.entries(best)){const a=ap[d];b.city=a?a[2]||a[1]:d;b.country=a?a[3]:'';b.lead=days(t,b.date);
    const m1=med(C[b.o+'-'+d]),m2=rt?med(C[d+'-'+b.h]):0;
    if(m1&&(m2||!rt)){b.usual=m1+m2;b.save=Math.round(100*(1-b.p/b.usual));}
    if(!rt&&C[b.o+'-'+d])b.near=fut(C[b.o+'-'+d]).filter(x=>x<=b.p*1.1).length-1;}
  const mx=+st.anyMaxp||Infinity,byP=(a,b)=>a[1].p-b[1].p;
  const band=v=>v==null?-99:Math.floor(v/10);  // price stays a priority: savings in steps of 10 %, departures week by week, cheapest first within each

    az:(a,b)=>a[1].country.localeCompare(b[1].country)||byP(a,b)};
  const rows=Object.entries(best).filter(x=>x[1].p<=mx&&anyDestOk(x[0],x[1])).sort(SORT[st.anySort]||byP);
  const inTxt=n=>n<=0?'today':n===1?'tomorrow':n<14?`in ${n} days`:n<60?`in ${Math.round(n/7)} weeks`:`in ${Math.round(n/30.4)} months`;
  const why=b=>{const x=[];
    if(b.save>=15)x.push(`<span class="tag direct">${b.save}% under usual</span>`);
    else if(b.save<=-15)x.push(`<span class="tag">${-b.save}% over usual</span>`);
    if(b.usual)x.push(`usually about ${KR(b.usual)}`);
    if(b.near!=null)x.push(b.near<=0?'only this day':b.near<3?`${b.near} other day${b.near===1?'':'s'} near this price`:`${b.near} other days near this price`);
    x.push('leaves '+inTxt(b.lead));
    return `<div class="why">${x.map((v,i)=>i&&!x[i-1].startsWith('<')?'<span>· '+v+'</span>':'<span>'+v+'</span>').join('')}</div>`};
  if(!rows.length){$('view').innerHTML=rt&&Object.keys(ANY.routes||{}).length&&!ANY.cal
    ?empty('No round trips yet.','Round trips need prices both ways; they show from the next anywhere scan.')
    :empty(rt?'No round trips match.':Object.keys(best).length?(st.anyDest.length?'Nothing matches.':'Nothing under that price.'):'No anywhere prices yet.',rt||Object.keys(best).length?(st.anyDest.length?'Try more destinations, a higher max price or more airports.':'Try a higher max price, more days or more airports.'):'They are added while the anywhere scan runs.');return;}
  const shown=rows.slice(0,st.limit);
  const gfR=(o,d,d1,d2)=>'https://www.google.com/travel/flights?hl=en&curr=DKK&q='+encodeURIComponent(`flights from ${o} to ${d} on ${d1} returning ${d2}`);
  $('view').innerHTML=`<div class="lead"><span>${rows.length} destinations, ${rt?`cheapest round trip of ${st.anyMin===st.anyMax?esc(st.anyMin):esc(st.anyMin)+'–'+esc(st.anyMax)} days`:'cheapest one-way ticket'} in the next 6 months${st.anySort==='save'?', best deals first, cheapest first among similar deals':st.anySort==='soon'?', week by week, cheapest first in each week':st.anySort==='az'?', by country':''}</span><span>Updated ${new Date(ANY.updated).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div><div class="list two">${shown.map(([d,b])=>{const a=ap[d],city=b.city;
    return `<article class="card"><div class="top"><div><div class="head">${esc(city)} (${esc(d)})</div><div class="sub">${a?esc(a[3])+' · ':''}${rt?`${esc(nm(b.o))}${b.h!==b.o?', home to '+esc(nm(b.h)):''}, ${fd(b.date)} → ${fd(b.back)}, ${b.n} day${b.n===1?'':'s'}`:`from ${esc(nm(b.o))}, ${fd(b.date)}`}</div></div><div class="pr"><div class="price">${kr(b.p)}<small>kr</small></div></div></div>
    ${rt?`<div class="sub" style="margin-top:6px">Out ${KR(b.p1)} + home ${KR(b.p2)}, two one-way tickets</div>`:''}${why(b)}
    <div class="links">${rt?lnk(gf(b.o,d,b.date,false),'Out')+lnk(gf(d,b.h,b.back,false),'Home')+(b.h===b.o?lnk(gfR(b.o,d,b.date,b.back),'As round trip'):''):lnk(gf(b.o,d,b.date,false),'Open in Google Flights')}</div></article>`}).join('')}</div>${moreBtn(shown.length,rows.length)}`;
  wireMore();

// ---------- patterns ----------
const BUCKETS=['6+ months','3–6 months','2–3 months','1–2 months','2–4 weeks','1–2 weeks','0–7 days'];
const WDS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],WDL={Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};
const pct=(a,n)=>n?Math.round(100*a/n):0;
const skr=v=>v==null?'–':(v>0?'+':v<0?'−':'')+kr(Math.abs(v))+' kr';
function renderPat(){
  const P=PAT&&(PAT.by_dest?(PAT.by_dest[DST()]&&{checks:PAT.checks,since:PAT.since,...PAT.by_dest[DST()]}):DST()==='KEF'?PAT:null);
  if(!P||!P.checks){$('view').innerHTML=empty('No patterns yet.','Patterns show up after a few price checks. Come back in a few days.');return;}
  const k=st.stops==='direct'?'direct':'any',ENOUGH=30;
  const lead=`<div class="lead"><span>Based on ${kr(P.checks)} check${P.checks===1?'':'s'} since ${P.since?fdd(P.since.slice(0,10)):'the start'}. Patterns get clearer after a few weeks.</span></div>`;
  // 1. by days before departure
  const mb=(P.moves_by_days_before?.[k]||[]),byB=new Map(mb.map(x=>[x.bucket,x]));
  const order=[...BUCKETS.filter(b=>byB.has(b)),...mb.map(x=>x.bucket).filter(b=>!BUCKETS.includes(b))];
  const ok=order.map(b=>byB.get(b)).filter(x=>x.n>=ENOUGH);
  let take1='Not enough data yet for a clear pattern. It needs a few weeks of checks.',dim1=true;
  if(ok.length){const up=ok.reduce((a,b)=>b.up/b.n>a.up/a.n?b:a),dn=ok.reduce((a,b)=>b.down/b.n>a.down/a.n?b:a);
    const parts=[];if(up.up>=10)parts.push(`prices rise most often ${up.bucket} before departure (${pct(up.up,up.n)}% of the time)`);
    if(dn.down>=10)parts.push(`${parts.length?'and they ':'prices '}drop most often ${dn.bucket} before (${pct(dn.down,dn.n)}%)`);
    if(parts.length){dim1=false;take1=parts.join(', ').replace(/^p/,'P')+'.';}
    else take1='Prices have hardly moved between the checks so far, so there is no pattern yet.';}
  const rows=order.map(b=>{const x=byB.get(b),n=x.n||0;
    if(!n)return `<div class="brow"><span class="bl">${esc(b)}</span><div class="stack nodata" aria-label="No data yet"></div><span class="bv sub">No data yet</span></div>`;
    const t=`${b} before: ${x.down} drops, ${x.same} same, ${x.up} rises (${n} in all), average change ${skr(x.avg_kr)}`;
    return `<div class="brow" title="${esc(t)}"><span class="bl">${esc(b)}</span>
      <div class="stack" role="img" aria-label="${esc(t)}"><span class="sdown" style="flex:${x.down}"></span><span class="ssame" style="flex:${x.same}"></span><span class="sup" style="flex:${x.up}"></span></div>
      <span class="bv ${x.avg_kr<0?'down':x.avg_kr>0?'up':''}">${skr(x.avg_kr)}${x.avg_pct!=null?` <span class="sub">(${x.avg_pct>0?'+':''}${String(Math.round(x.avg_pct*10)/10).replace('.',',')}%)</span>`:''}</span>
      <span class="bs">▼ ${pct(x.down,n)}% &ensp;▲ ${pct(x.up,n)}% &ensp;${n} comparison${n===1?'':'s'}${n<ENOUGH?', too few to trust':''}</span></div>`}).join('');
  const sec1=`<section class="pat"><h2>How prices move as departure gets closer</h2><p class="take${dim1?' dim':''}">${take1}</p>

}

function renderRel(){

  const fl=BOARD.filter(b=>st.out.has(b.apt)&&(st.chDir==='both'||(st.chDir==='to')===(b.dir==='to KEF')));
  if(!fl.length){$('view').innerHTML=empty('No flights seen yet for these filters.','The Keflavík flight board is read 4 times a day.');return;}
  const by=new Map();fl.forEach(b=>{const x=by.get(b.airline)||{n:0,c:0,d:0};x.n++;if(/cancel/i.test(b.status))x.c++;else if(delay(b)>=30)x.d++;by.set(b.airline,x)});
  const agg=[...by.entries()].sort((a,b)=>b[1].c/b[1].n-a[1].c/a[1].n||b[1].n-a[1].n);

    <span class="sub"><b class="${x.c?'up':''}">${x.c} cancelled</b> (${pc(x.c,x.n)}%), ${x.d} delayed 30+ min (${pc(x.d,x.n)}%)</span></div>`).join('')}</div>

}

   <line x1="${X(last.at).toFixed(1)}" x2="${X(last.at).toFixed(1)}" y1="${Y(last.total).toFixed(1)}" y2="${Y(last.total).toFixed(1)}" stroke="var(--surface)" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;

    const b=$('dAdd');b.disabled=true;msg('Adding…',true);
    try{DESTS=await destApi('POST','/api/dests',{code,name:$('dName').value.trim(),place:$('dPlace').value.trim()});
      P.hidden=true;P.innerHTML='';PENDING.add(code);setDest(code);waitForPrices(code);}
    catch(e){msg(e.message);b.disabled=false}
  };
  P.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async e=>{e.preventDefault();
    const d=destOf(b.dataset.rm);if(!confirm(`Remove ${d?.name||b.dataset.rm}? Its prices stop being checked.`))return;
    try{DESTS=await destApi('DELETE','/api/dests/'+encodeURIComponent(b.dataset.rm));
      if(!destOf(DST()))setDest(DESTS[0].code);else drawDest();openDPanel();}
    catch(e){msg(e.message)}
  });
}
// Status of each destination's prices: where they come from, how many days, flight times, last update
const ago=t=>{if(!t)return '';const m=Math.round((Date.now()-Date.parse(t))/6e4);return m<1?'just now':m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
function destStatus(d){
  const S=L?.status||{},rs=[...APTS.map(a=>`${a}-${d.code}`),...APTS.map(a=>`${d.code}-${a}`)],xs=rs.map(r=>[r,S[r]]);
  const g=xs.filter(([,x])=>x?.src==='google').length,t=xs.filter(([,x])=>x?.src==='tp').length,tm=xs.filter(([,x])=>x?.times).length;
  const known=xs.some(([,x])=>x),last=xs.map(([,x])=>x?.at).filter(Boolean).sort().pop();
  let cls,txt;
  if(!known){cls='wait';txt=PENDING.has(d.code)?'Getting first prices…':'Waiting for the first price check';}
  else if(!g&&!t){cls='';txt='No flights found';}
  else if(g&&tm>=g){cls='ok';txt=`Google prices with flight times, ${g} of ${rs.length} routes`;}
  else if(g){cls='part';txt=`Google prices on ${g} of ${rs.length} routes${t?`, first prices on ${t} more`:''}. Flight times come with the next full run.`;}
  else{cls='wait';txt=`First prices on ${t} of ${rs.length} routes. Waiting for Google prices (about 10 min after adding).`;}
  const rows=xs.map(([r,x])=>{const [o,de]=r.split('-');return `<tr><td>${esc(o)} → ${esc(de)}</td><td>${!x||!x.src?'None found':x.src==='google'?'Google':'Travelpayouts'}</td><td>${x?.src?kr(x.any):'–'}</td><td>${x?.src?kr(x.direct):'–'}</td><td>${x?.times?'Yes':'–'}</td></tr>`}).join('');
  return `<details><summary><span class="dot ${cls}" aria-hidden="true"></span><span><span class="dn">${esc(d.name)} (${esc(d.code)})</span><br><span class="ds">${esc(txt)}${last?` · updated ${ago(last)}`:''}</span></span>${DESTS.length>1?`<button type="button" class="rm" data-rm="${esc(d.code)}" aria-label="Remove ${esc(d.name)}">Remove</button>`:''}</summary>
    <table><thead><tr><th>Route</th><th>Prices from</th><th>Days</th><th>Direct</th><th>Times</th></tr></thead><tbody>${rows}</tbody></table></details>`;
}

// Airport list for the search: [code, airport name, city, country, 1 = large airport], loaded when first needed
let AIRPORTS=null;
const loadAirports=()=>Array.isArray(AIRPORTS)?Promise.resolve(AIRPORTS):AIRPORTS||(AIRPORTS=fetch('airports.json').then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>{AIRPORTS=null;return null}));
const fold=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function searchAirports(all,q){
  const w=fold(q).trim(),out=[];
  for(const a of all){
    const code=a[0].toLowerCase(),city=fold(a[2]),name=fold(a[1]),land=fold(a[3]);
    let sc=code===w?100:city===w?80:city.startsWith(w)?60:name.split(/[\s\-\/]+/).some(x=>x.startsWith(w))?45:city.includes(w)||name.includes(w)?30:land.startsWith(w)?20:0;
    if(!sc&&w.includes(' ')){const ws=w.split(/\s+/);if(ws.every(x=>`${code} ${city} ${name} ${land}`.includes(x)))sc=25;}
    if(sc)out.push([sc+(a[4]?10:0),a]);
  }
  return out.sort((x,y)=>y[0]-x[0]).slice(0,8).map(x=>x[1]);
}

// After adding an airport the server fetches its first prices (Travelpayouts) right away: look every 10 s for up to 3 min
async function waitForPrices(code){
  const t0=Date.now();
  while(Date.now()-t0<180000){
    await new Promise(r=>setTimeout(r,10000));
    try{const j=await fetch('data/latest.json',{cache:'no-store'}).then(r=>r.json());
      if(Object.keys(j.cal||{}).some(r=>r.split('-').includes(code))){L=j;PAT=await fetch('data/patterns.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>PAT);break;}}catch(e){}
  }
  PENDING.delete(code);
  if(DST()===code){drawFilters();render();}
}

function render(){({trips:renderTrips,watch:renderWatches,cal:renderCal,changes:renderChanges,pat:renderPat,any:renderAny,rel:renderRel})[view]();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;navOn();st.limit=40;drawFilters();render();});
(async()=>{
  try{
    const get=f=>fetch('data/'+f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.json()});
    [L,CH,BOARD,WATCH,BAGS,PAT]=await Promise.all([get('latest.json'),get('changes.json').catch(()=>[]),get('board.json').catch(()=>[]),get('watches.json').catch(()=>[]),get('bags.json').catch(()=>null),get('patterns.json').catch(()=>null)]);
    if(!Array.isArray(WATCH))WATCH=[];
    const ds=await get('dests.json').catch(()=>null);
    if(Array.isArray(ds)&&ds.length)DESTS=ds;else if(Array.isArray(L.dests)&&L.dests.length)DESTS=L.dests;
    if(!destOf(st.dest)){st.dest=DESTS[0].code;st.route='ALL-'+st.dest;}
    drawDest();
    const idx=await get('index.json').catch(()=>({runs:[]}));
    $('status').textContent=`Last check ${new Date(L.run_at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}, ${idx.runs.length} check${idx.runs.length===1?'':'s'} stored, prices for 1 adult`;
    drawFilters();render();
  }catch(e){$('status').textContent='Could not load the prices: '+e.message+'. Try reloading the page.';}
})();
</script>
