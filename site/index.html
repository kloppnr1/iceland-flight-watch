<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iceland Flight Watch</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e3e3de;--accent:#1f5fbf;--good:#1a7f45;--bad:#c0392b;--chip:#eef3fb}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--card:#1f1f1d;--ink:#ededea;--muted:#9a9a94;--line:#34342f;--accent:#7aaaff;--good:#4cc27e;--bad:#ff7a6b;--chip:#1e2a3d}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 20px 4px}h1{margin:0;font-size:20px}.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;padding:8px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);font:inherit;cursor:pointer}
nav button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
main{padding:16px 20px;max-width:1300px}
.filters{display:flex;flex-wrap:wrap;gap:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:4px}.f .t{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips label{border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none}
.chips input{display:none}.chips label:has(input:checked){border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--chip)}
select,input[type=number],input[type=date]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
input[type=number]{width:80px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--bg)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.m-only{display:none}@media (max-width:700px){.m-only{display:inline;color:var(--muted);font-size:12px}}
.tag.direct{border-color:var(--good);color:var(--good)}
.down{color:var(--good);font-weight:600}.up{color:var(--bad);font-weight:600}.new{color:var(--accent)}
.small{font-size:12px;color:var(--muted)}
.count{color:var(--muted);margin:0 0 8px}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px}
.wrap{overflow-x:auto}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.month{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.month h4{margin:0 0 6px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;text-align:center}
.grid .dow{color:var(--muted)}
.grid .d{border-radius:5px;padding:3px 0;min-height:34px}
.grid .d b{display:block;font-size:10px;font-weight:500;color:var(--muted)}
.grid .d span{display:block;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin:0 0 10px}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:middle;margin-right:3px}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--bad);vertical-align:middle;margin-left:6px}
@media (max-width:700px){
 header{padding:14px 12px 2px}nav{padding:6px 8px;gap:2px}nav button{padding:6px 8px;font-size:13px}main{padding:10px}
 .filters{gap:10px 12px;padding:10px}.f input[type=date]{width:130px}
 table.cards thead{display:none}table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
 table.cards tr{border-bottom:1px solid var(--line);padding:9px 12px;display:grid;grid-template-columns:1fr 1fr;gap:1px 12px}table.cards td.hide-m{display:none!important}table.cards tr:last-child{border-bottom:0}
 table.cards td{border:0;padding:1px 0;white-space:normal;text-align:left}
 table.cards td[data-l]::before{content:attr(data-l) " ";color:var(--muted);font-size:12px}
 table.cards td.hide-m{display:none}
 .months{grid-template-columns:1fr}.legend{flex-wrap:wrap}
}
</style>
</head>
<body>
<header><h1>Iceland Flight Watch</h1><div class="sub" id="status">Loading…</div></header>
<nav>
  <button data-v="trips" class="on">Cheapest round trips</button>
  <button data-v="cal">Price calendar</button>
  <button data-v="changes">Changes</button>
  <button data-v="rel">Cancellations &amp; delays</button>
</nav>
<main>
<div class="filters" id="filters"></div>
<div id="view"></div>
</main>
<script>
const APTS=['CPH','BLL','AAL','HAM'],NAME={CPH:'Copenhagen',BLL:'Billund',AAL:'Aalborg',HAM:'Hamburg',KEF:'Keflavík'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kr=v=>v==null?'–':Math.round(v).toLocaleString('da-DK');
const D=s=>new Date(s+'T12:00:00Z');const iso=d=>d.toISOString().slice(0,10);
const add=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const days=(a,b)=>Math.round((D(b)-D(a))/864e5);
const fd=s=>D(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'2-digit'});
const gf=(o,d,date,direct)=>'https://www.google.com/travel/flights?hl=en&curr=DKK&q='+encodeURIComponent(`${direct?'nonstop ':''}one way flights from ${o} to ${d} on ${date}`);
const gfRT=(o,d1,d2,direct)=>'https://www.google.com/travel/flights?hl=en&curr=DKK&q='+encodeURIComponent(`${direct?'nonstop ':''}flights from ${o} to KEF on ${d1} returning ${d2}`);
let L=null,CH=[],BOARD=[],view='trips';
const st={out:new Set(APTS),home:new Set(APTS),minM:1,maxM:6,stops:'any',from:'',to:'',maxp:'',src:new Set(['Google Flights','Travelpayouts']),route:'CPH-KEF',kind:'any',chDir:'both',chWhat:'drops'};

function series(route,kind,prev){const c=(prev?L.prev_cal:L.cal)[route]?.[kind];const m=new Map();if(!c)return m;let d=c.start;c.p.forEach(v=>{if(v)m.set(d,v);d=add(d,1)});return m;}

// ---------- filters UI ----------
function chips(id,label,vals,set,names){return `<div class="f"><span class="t">${label}</span><div class="chips" data-set="${id}">${vals.map(v=>`<label><input type="checkbox" value="${v}" ${set.has(v)?'checked':''}><span>${names?names[v]:v}</span></label>`).join('')}</div></div>`}
function radios(id,label,opts,cur){return `<div class="f"><span class="t">${label}</span><div class="chips" data-radio="${id}">${opts.map(([v,l])=>`<label><input type="radio" name="${id}" value="${v}" ${cur===v?'checked':''}><span>${l}</span></label>`).join('')}</div></div>`}
function drawFilters(){
  let h='';
  if(view==='trips'){
    h+=chips('out','Fly out from',APTS,st.out)+chips('home','Fly home to',APTS,st.home);
    h+=`<div class="f"><span class="t">Stay (months)</span><div style="display:flex;gap:4px;align-items:center"><input type="number" min="0" max="11" step="0.5" id="minM" value="${st.minM}"> – <input type="number" min="0" max="11" step="0.5" id="maxM" value="${st.maxM}"></div></div>`;
    h+=radios('stops','Flights',[['any','Any'],['direct','Direct only']],st.stops);
    h+=`<div class="f"><span class="t">Leave between</span><div style="display:flex;gap:4px"><input type="date" id="from" value="${st.from}"><input type="date" id="to" value="${st.to}"></div></div>`;
    h+=`<div class="f"><span class="t">Max total (DKK)</span><input type="number" id="maxp" value="${st.maxp}" placeholder="any"></div>`;
    h+=chips('src','Source',['Google Flights','Travelpayouts'],st.src);
  } else if(view==='cal'){
    const routes=Object.keys(L.cal).sort((a,b)=>(a.startsWith('KEF')-b.startsWith('KEF'))||a.localeCompare(b));
    h+=`<div class="f"><span class="t">Route</span><select id="route">${routes.map(r=>`<option value="${r}" ${r===st.route?'selected':''}>${NAME[r.split('-')[0]]} → ${NAME[r.split('-')[1]]}</option>`).join('')}</select></div>`;
    const kinds=Object.keys(L.cal[st.route]||{});if(!kinds.includes(st.kind))st.kind='any';
    h+=radios('kind','Flights',[['any','Any'],...(kinds.includes('direct')?[['direct','Direct only']]:[])],st.kind);
  } else if(view==='changes'){
    h+=radios('chDir','Direction',[['both','Both'],['to','To Iceland'],['from','From Iceland']],st.chDir);
    h+=radios('chWhat','Show',[['drops','Price drops'],['all','All changes']],st.chWhat);
    h+=chips('out','Danish/German airport',APTS,st.out);
  } else {
    h+=radios('chDir','Direction',[['both','Both'],['to','To Iceland'],['from','From Iceland']],st.chDir);
    h+=chips('out','Danish/German airport',APTS,st.out);
  }
  $('filters').innerHTML=h;
  $('filters').querySelectorAll('[data-set] input').forEach(i=>i.onchange=()=>{const s=st[i.closest('[data-set]').dataset.set];i.checked?s.add(i.value):s.delete(i.value);render()});
  $('filters').querySelectorAll('[data-radio] input').forEach(i=>i.onchange=()=>{st[i.name]=i.value;render()});
  ['minM','maxM','from','to','maxp'].forEach(id=>{const e=$(id);if(e)e.oninput=()=>{st[id]=e.value;render()}});
  const r=$('route');if(r)r.onchange=()=>{st.route=r.value;drawFilters();render()};
}

// ---------- round trips ----------
function trips(){
  const direct=st.stops==='direct',minD=Math.round(+st.minM*30.4),maxD=Math.round(+st.maxM*30.4)||9999,today=iso(new Date());
  const rows=[];
  if(st.src.has('Google Flights')){
    for(const o of st.out){const A=series(`${o}-KEF`,direct?'direct':'any');if(!A.size)continue;const Ad=direct?A:series(`${o}-KEF`,'direct'),Ap=series(`${o}-KEF`,direct?'direct':'any',true);
      for(const h of st.home){const B=series(`KEF-${h}`,direct?'direct':'any');if(!B.size)continue;const Bd=direct?B:series(`KEF-${h}`,'direct'),Bp=series(`KEF-${h}`,direct?'direct':'any',true);
        const bArr=[...B.entries()].sort();
        for(const [d1,p1] of A){if(d1<today||(st.from&&d1<st.from)||(st.to&&d1>st.to))continue;
          let best=null;for(const [d2,p2] of bArr){const n=days(d1,d2);if(n<minD)continue;if(n>maxD)break;if(!best||p2<best[1])best=[d2,p2];}
          if(!best)continue;const [d2,p2]=best;
          rows.push({src:'Google Flights',o,h,d1,d2,p1,p2,total:p1+p2,stay:days(d1,d2),dir1:Ad.get(d1),dir2:Bd.get(d2),prev:(Ap.get(d1)&&Bp.get(d2))?Ap.get(d1)+Bp.get(d2):null});}
      }}
  }
  if(st.src.has('Travelpayouts')){
    for(const r of L.tp_rt){if(!st.out.has(r.o)||!st.home.has(r.o))continue;const n=days(r.out,r.back);if(n<minD||n>maxD)continue;if(direct&&(r.stops||r.rstops))continue;
      if((st.from&&r.out<st.from)||(st.to&&r.out>st.to)||r.out<today)continue;
      rows.push({src:'Travelpayouts',o:r.o,h:r.o,d1:r.out,d2:r.back,total:r.p,stay:n,al:r.al,stops:r.stops,rstops:r.rstops,link:r.link,t1:r.outdep,t2:r.backdep});}
  }
  const mx=+st.maxp||Infinity;return rows.filter(r=>r.total<=mx).sort((a,b)=>a.total-b.total);
}
function renderTrips(){
  const all=trips();
  if(!all.length){$('view').innerHTML='<div class="empty">No round trips match these filters.</div>';return;}
  // keep the cheapest trip per departure week + airport pair so the list is varied
  const seen=new Set(),rows=[];for(const r of all){const k=r.src+r.o+r.h+r.d1.slice(0,8)+Math.floor(+r.d1.slice(8)/8);if(seen.has(k))continue;seen.add(k);rows.push(r);if(rows.length>=150)break;}
  const best=rows[0];
  $('view').innerHTML=`<p class="count">Cheapest: <b>${kr(best.total)} DKK</b> — ${NAME[best.o]} ${fd(best.d1)} → home to ${NAME[best.h]} ${fd(best.d2)} (${Math.round(best.stay/30.4*10)/10} months). Showing the cheapest trip per week of departure.</p>
  <div class="wrap"><table class="cards"><thead><tr><th>Out</th><th>From</th><th class="num">Out price</th><th>Home</th><th>To</th><th class="num">Home price</th><th class="num">Stay</th><th class="num">Total DKK</th><th class="num">Since last check</th><th>Book / details</th><th>Source</th></tr></thead><tbody>${rows.map(r=>{
    if(r.src==='Travelpayouts')return `<tr><td data-l="Out">${fd(r.d1)} <span class="small">${esc(r.t1)}</span></td><td data-l="From">${r.o}</td><td class="num small" data-l="Type">round trip</td><td data-l="Home">${fd(r.d2)} <span class="small">${esc(r.t2)}</span></td><td data-l="To">${r.h}</td><td class="num small" data-l="Airline">${esc(r.al)}</td><td class="num" data-l="Stay">${Math.round(r.stay/30.4*10)/10} mo</td><td class="num" data-l="Total"><b>${kr(r.total)} DKK</b></td><td class="num hide-m">–</td><td data-l="Book">​<a href="${esc(r.link)}" target="_blank" rel="noopener">Aviasales ↗</a> <span class="small">${r.stops||r.rstops?'with stops':'<span class="tag direct">direct</span>'}</span></td><td class="hide-m"><span class="tag">Travelpayouts</span></td></tr>`;
    const ch=r.prev==null?'<span class="new">new</span>':r.total<r.prev?`<span class="down">▼ ${kr(r.prev-r.total)}</span>`:r.total>r.prev?`<span class="up">▲ ${kr(r.total-r.prev)}</span>`:'–';
    const dtag=(p,d)=>st.stops==='direct'?'<span class="tag direct">direct</span>':d?`<span class="small">direct ${kr(d)}</span>`:'';
    return `<tr><td data-l="Out">${fd(r.d1)} <span class="m-only">from ${r.o}</span></td><td class="hide-m">${r.o}</td><td class="num" data-l="Price">${kr(r.p1)} ${dtag(r.p1,r.dir1)}</td><td data-l="Home">${fd(r.d2)} <span class="m-only">to ${r.h}</span></td><td class="hide-m">${r.h}</td><td class="num" data-l="Price">${kr(r.p2)} ${dtag(r.p2,r.dir2)}</td><td class="num" data-l="Stay">${Math.round(r.stay/30.4*10)/10} mo</td><td class="num" data-l="Total"><b>${kr(r.total)} DKK</b></td><td class="num" data-l="Since last check">${ch}</td><td data-l="Open"><a href="${gf(r.o,'KEF',r.d1,st.stops==='direct')}" target="_blank" rel="noopener">Out ↗</a> · <a href="${gf('KEF',r.h,r.d2,st.stops==='direct')}" target="_blank" rel="noopener">Home ↗</a>${r.o===r.h?` · <a href="${gfRT(r.o,r.d1,r.d2,st.stops==='direct')}" target="_blank" rel="noopener">Round trip ↗</a>`:''}</td><td class="hide-m"><span class="tag">Google</span></td></tr>`}).join('')}</tbody></table></div>
  <p class="small" style="margin-top:8px">Google prices are the cheapest one-way fare that day ("from" price, 1 adult). Open the links to see the exact flights. Travelpayouts rows are real round-trip fares other people found in the last few days, same airport both ways.</p>`;
}

// ---------- price calendar ----------
function renderCal(){
  const [o,d]=st.route.split('-');const cur=series(st.route,st.kind),prev=series(st.route,st.kind,true);
  if(!cur.size){$('view').innerHTML='<div class="empty">No prices for this route.</div>';return;}
  const tpm=new Map();L.tp_ow.filter(x=>x.o===o&&x.d===d&&(st.kind!=='direct'||!x.stops)).forEach(x=>{if(!tpm.has(x.date)||x.p<tpm.get(x.date).p)tpm.set(x.date,x)});
  const vals=[...cur.values()].sort((a,b)=>a-b),q=p=>vals[Math.floor(p*(vals.length-1))],c1=q(.2),c2=q(.5),c3=q(.8);
  const col=v=>v<=c1?'rgba(26,127,69,.30)':v<=c2?'rgba(26,127,69,.13)':v<=c3?'rgba(192,57,43,.10)':'rgba(192,57,43,.25)';
  const keys=[...cur.keys()].sort();const months=[];let m=keys[0].slice(0,7);while(m<=keys[keys.length-1].slice(0,7)){months.push(m);const dd=D(m+'-01');dd.setUTCMonth(dd.getUTCMonth()+1);m=iso(dd).slice(0,7);}
  const html=months.map(mm=>{const first=D(mm+'-01'),off=(first.getUTCDay()+6)%7;let cells='MTWTFSS'.split('').map(x=>`<div class="dow">${x}</div>`).join('')+'<div></div>'.repeat(off);
    for(let day=1;day<=31;day++){const ds=`${mm}-${String(day).padStart(2,'0')}`;if(D(ds).getUTCMonth()!==first.getUTCMonth())break;const v=cur.get(ds),pv=prev.get(ds),tp=tpm.get(ds);
      const arrow=v&&pv&&v!==pv?(v<pv?'<i class="down">▼</i>':'<i class="up">▲</i>'):'';
      cells+=v?`<a class="d" style="background:${col(v)}" href="${gf(o,d,ds,st.kind==='direct')}" target="_blank" rel="noopener" title="${fd(ds)}: ${kr(v)} DKK${pv?' (last check '+kr(pv)+')':''}${tp?' · Travelpayouts '+kr(tp.p)+' '+tp.al:''}"><b>${day}</b><span>${Math.round(v/100)/10}k${arrow}</span></a>`:`<div class="d"><b>${day}</b></div>`;}
    return `<div class="month"><h4>${D(mm+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h4><div class="grid">${cells}</div></div>`}).join('');
  $('view').innerHTML=`<div class="legend"><span><i class="sw" style="background:rgba(26,127,69,.30)"></i>cheapest 20%</span><span><i class="sw" style="background:rgba(192,57,43,.25)"></i>priciest 20%</span><span>Prices in thousands of DKK, cheapest one-way that day. ▼▲ = changed since last check. Click a day to open Google Flights.</span></div><div class="months">${html}</div>`;
}

// ---------- changes ----------
function renderChanges(){
  const rows=CH.filter(c=>{const [o,d]=c.route.split('-');const apt=o==='KEF'?d:o;if(!st.out.has(apt))return false;if(st.chDir==='to'&&d!=='KEF')return false;if(st.chDir==='from'&&o!=='KEF')return false;if(st.chWhat==='drops'&&c.what!=='Price drop')return false;return c.date>=iso(new Date());}).sort((a,b)=>b.seen.localeCompare(a.seen)||((a.new??0)-(a.old??0))-((b.new??0)-(b.old??0))).slice(0,500);
  if(!CH.length){$('view').innerHTML='<div class="empty">Changes show up from the second daily check.</div>';return;}
  if(!rows.length){$('view').innerHTML='<div class="empty">No changes match these filters.</div>';return;}
  $('view').innerHTML=`<p class="count">${rows.length} changes (price changes under 50 DKK are ignored)</p><div class="wrap"><table class="cards"><thead><tr><th>Seen</th><th>What</th><th>Route</th><th>Flights</th><th>Travel date</th><th class="num">Before</th><th class="num">Now</th><th class="num">Difference</th><th></th></tr></thead><tbody>${rows.map(c=>{const [o,d]=c.route.split('-');const diff=c.old!=null&&c.new!=null?c.new-c.old:null;return `<tr><td data-l="Seen">${D(c.seen.slice(0,10)).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</td><td class="${c.what==='Price drop'?'down':c.what==='Price rise'||c.what==='No longer offered'?'up':'new'}">${c.what}</td><td data-l="Route">${o} → ${d}</td><td data-l="Flights">${c.kind==='direct'?'<span class="tag direct">direct</span>':'any'}</td><td data-l="Travel date">${fd(c.date)}</td><td class="num" data-l="Before">${kr(c.old)}</td><td class="num" data-l="Now">${kr(c.new)}</td><td class="num ${diff<0?'down':diff>0?'up':''}" data-l="Difference">${diff==null?'':(diff>0?'+':'')+kr(diff)}</td><td><a href="${gf(o,d,c.date,c.kind==='direct')}" target="_blank" rel="noopener">Open ↗</a></td></tr>`}).join('')}</tbody></table></div>`;
}

// ---------- reliability ----------
function renderRel(){
  const delay=b=>{if(!b.est||!b.sched)return 0;const t=s=>+s.slice(0,2)*60+ +s.slice(3);let d=t(b.est)-t(b.sched);if(d<-600)d+=1440;return d;};
  const fl=BOARD.filter(b=>st.out.has(b.apt)&&(st.chDir==='both'||(st.chDir==='to')===(b.dir==='to KEF')));
  if(!fl.length){$('view').innerHTML='<div class="empty">No flights seen yet for these filters.</div>';return;}
  const by=new Map();fl.forEach(b=>{const x=by.get(b.airline)||{n:0,c:0,d:0,days:new Set()};x.n++;x.days.add(b.day);if(/cancel/i.test(b.status))x.c++;else if(delay(b)>=30)x.d++;by.set(b.airline,x)});
  const agg=[...by.entries()].sort((a,b)=>b[1].c/b[1].n-a[1].c/a[1].n||b[1].n-a[1].n);
  $('view').innerHTML=`<p class="count">${fl.length} flights seen on Keflavík Airport's flight board, over ${new Set(fl.map(b=>b.day)).size} day(s). The board is read once a day, so the picture gets clearer over time.</p>
  <div class="wrap"><table><thead><tr><th>Airline</th><th class="num">Flights seen</th><th class="num">Cancelled</th><th class="num">Delayed 30+ min</th></tr></thead><tbody>${agg.map(([a,x])=>`<tr><td>${esc(a)}</td><td class="num">${x.n}</td><td class="num">${x.c} (${Math.round(100*x.c/x.n)}%)<span class="bar" style="width:${Math.round(60*x.c/x.n)}px"></span></td><td class="num">${x.d} (${Math.round(100*x.d/x.n)}%)</td></tr>`).join('')}</tbody></table></div>
  <h3 style="margin:22px 0 8px;font-size:15px">Every flight seen</h3><div class="wrap"><table class="cards"><thead><tr><th>Day · flight</th><th></th><th>Airline</th><th>Route</th><th>Scheduled</th><th>Actual / expected</th><th>Status</th></tr></thead><tbody>${fl.slice().sort((a,b)=>(b.day+b.sched).localeCompare(a.day+a.sched)).slice(0,400).map(b=>`<tr><td>${fd(b.day)} · <b>${esc(b.flight)}</b></td><td class="hide-m"></td><td data-l="Airline">${esc(b.airline)}</td><td data-l="Route">${b.dir==='to KEF'?b.apt+' → KEF':'KEF → '+b.apt}</td><td data-l="Scheduled">${esc(b.sched)}</td><td data-l="Actual">${esc(b.est)}${delay(b)>=30?` <span class="up">+${delay(b)} min</span>`:''}</td><td data-l="Status" class="${/cancel/i.test(b.status)?'up':''}">${esc(b.status)}</td></tr>`).join('')}</tbody></table></div>`;
}

function render(){({trips:renderTrips,cal:renderCal,changes:renderChanges,rel:renderRel})[view]();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));view=b.dataset.v;drawFilters();render();});
(async()=>{
  try{
    const get=f=>fetch('data/'+f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.json()});
    [L,CH,BOARD]=await Promise.all([get('latest.json'),get('changes.json').catch(()=>[]),get('board.json').catch(()=>[])]);
    const idx=await get('index.json').catch(()=>({runs:[]}));
    $('status').textContent=`Last check ${new Date(L.run_at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${idx.runs.length} check(s) stored · prices in DKK for 1 adult`;
    drawFilters();render();
  }catch(e){$('status').textContent='Could not load the data: '+e.message;}
})();
</script>
</body>
</html>
